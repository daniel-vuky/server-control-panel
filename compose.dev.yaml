name: scp-dev

x-volumes: &volumes
  - .:/src
  - gomod:/go/pkg/mod
  - gocache:/root/.cache/go-build
  - node_modules:/src/web/node_modules
  - pnpm-store:/root/.local/share/pnpm/store

# pnpm would otherwise place its store inside the bind-mounted repo (/src/.pnpm-store).
x-environment: &environment
  pnpm_config_store_dir: /root/.local/share/pnpm/store

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: scp-dev
    command: air
    # Reaps the process trees the runner kills on a timeout (see deploy/compose.yaml).
    init: true
    ports:
      - "127.0.0.1:5173:5173"
    # YAML cannot merge sequences or add keys to an alias, so api spells out its own lists.
    # The Docker socket goes to api only: tools (tests) never see Docker.
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
      - node_modules:/src/web/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      pnpm_config_store_dir: /root/.local/share/pnpm/store
      WORKSPACE_ROOTS: /src/dev/workspaces
      PANEL_DATA_DIR: /src/data
      # Dev-only values: a fixed key, the Vite origin, and no Google credentials,
      # so the fake Drive (dev build tag) stands in for Google.
      PANEL_SECRET_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      PANEL_PUBLIC_URL: http://localhost:5173
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""

  web:
    image: scp-dev
    network_mode: "service:api"
    working_dir: /src/web
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    volumes: *volumes
    environment: *environment
    depends_on:
      - api

  tools:
    image: scp-dev
    profiles: [tools]
    volumes: *volumes
    environment: *environment

volumes:
  gomod:
  gocache:
  node_modules:
  pnpm-store:
