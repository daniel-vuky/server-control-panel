name: scp-dev

x-volumes: &volumes
  - .:/src
  - gomod:/go/pkg/mod
  - gocache:/root/.cache/go-build
  - node_modules:/src/web/node_modules
  - pnpm-store:/root/.local/share/pnpm/store

# pnpm would otherwise place its store inside the bind-mounted repo (/src/.pnpm-store).
x-environment: &environment
  pnpm_config_store_dir: /root/.local/share/pnpm/store

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: scp-dev
    command: air
    ports:
      - "127.0.0.1:5173:5173"
    volumes: *volumes
    environment: *environment

  web:
    image: scp-dev
    network_mode: "service:api"
    working_dir: /src/web
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    volumes: *volumes
    environment: *environment
    depends_on:
      - api

  tools:
    image: scp-dev
    profiles: [tools]
    volumes: *volumes
    environment: *environment

volumes:
  gomod:
  gocache:
  node_modules:
  pnpm-store:
