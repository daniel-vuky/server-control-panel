name: scp-dev

x-volumes: &volumes
  - .:/src
  - gomod:/go/pkg/mod
  - gocache:/root/.cache/go-build
  - node_modules:/src/web/node_modules

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: scp-dev
    command: air
    ports:
      - "127.0.0.1:5173:5173"
    volumes: *volumes

  web:
    image: scp-dev
    network_mode: "service:api"
    working_dir: /src/web
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    volumes: *volumes
    depends_on:
      - api

  tools:
    image: scp-dev
    profiles: [tools]
    volumes: *volumes

volumes:
  gomod:
  gocache:
  node_modules:
