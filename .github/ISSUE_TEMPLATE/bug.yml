name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happens
      description: The wrong behavior, including error messages or logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know it is fixed (ideally a regression test).
      value: |
        - [ ] Regression test reproduces the bug and passes after the fix
        - [ ]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Branch/commit, OS, browser, server, etc.
    validations:
      required: false
