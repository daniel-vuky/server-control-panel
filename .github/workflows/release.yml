name: Release

# Runs after CI passes on a push to main and publishes the multi-arch panel image to GHCR.
# Everything is derived from the commit CI tested (workflow_run.head_sha): in this event the
# default SHA context is the current tip of main, which can be newer. So the short SHA is
# computed from head_sha below and passed to the tags, labels and build args explicitly.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Releases run one after another so every CI-green commit gets its sha- tag (a rollback target)
# and the last merge ends up as latest.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute the short SHA
        id: sha
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ghcr.io/daniel-vuky/server-control-panel
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=sha-${{ steps.sha.outputs.short }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.sha.outputs.short }}
            REVISION=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max
