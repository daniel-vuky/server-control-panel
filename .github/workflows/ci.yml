name: CI

on: pull_request

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # The workflow builds the dev image below (with the GHA layer cache), so make must not rebuild it.
      SKIP_DEV_IMAGE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dev
          tags: scp-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint, type-check, test and build
        run: make ci
