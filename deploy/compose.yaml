# The server control panel as a docker compose project, installed by
# install.sh into /opt/server-control-panel. install.sh refreshes this file on
# every run, so do not edit it here. Settings live in panel.env (Cloudflare
# values, workspace roots), .env (PANEL_TAG, UPDATE_INTERVAL) and the generated
# compose.override.yaml (user, docker group, workspace mounts).
name: server-control-panel

services:
  panel:
    image: ${PANEL_IMAGE:-ghcr.io/daniel-vuky/server-control-panel}:${PANEL_TAG:-latest}
    network_mode: host
    # PID 1 reaps the grandchildren left behind when the panel kills a docker
    # command that timed out; the panel binary itself never waits on them.
    init: true
    env_file: panel.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      # The host's root, read-only, only for statfs of its disks (used and total
      # per mount point). A plain recursive bind: rslave would make Docker
      # refuse to start the panel when / is not a shared mount. A disk mounted
      # after the panel started shows up after its next restart.
      - /:/host/root:ro
      - ./data:/data
    # It runs as a normal user and needs no capability; no-new-privileges
    # stops a setuid binary from gaining any back.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Pulls a newer panel image every UPDATE_INTERVAL seconds and recreates the
  # panel when it changed. It mounts the project directory at the same absolute
  # path, because the daemon resolves bind-mount paths on the host, and
  # read-only, because it only reads the project files. It never reads
  # panel.env into its own environment.
  updater:
    image: docker:29-cli
    # PID 1 for the shell script: without an init, SIGTERM is ignored and every
    # stop or recreate waits out the grace period and then SIGKILLs the updater.
    init: true
    entrypoint: ["/bin/sh", "/opt/server-control-panel/updater.sh"]
    environment:
      UPDATE_INTERVAL: "${UPDATE_INTERVAL:-300}"
    working_dir: /opt/server-control-panel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/server-control-panel:/opt/server-control-panel:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
